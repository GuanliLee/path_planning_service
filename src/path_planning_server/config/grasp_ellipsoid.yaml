path_planning_server:
  ros__parameters:
    # V2 grasp-object mode. Keep ellipsoid as the compatibility-safe default;
    # switch to cylinder or mesh only when calling /plan_to_pose_v2.
    grasp_object.type: ellipsoid
    grasp_object.tcp_offset_z_m: 0.1358
    grasp_mesh.root_resource: package://path_planning_server/meshes/beverages

    grasp_ellipsoid.mesh_resource: package://path_planning_server/meshes/grasp_ellipsoid/unit_sphere.stl
    grasp_ellipsoid.radius_x_m: 0.06
    grasp_ellipsoid.radius_y_m: 0.0385
    grasp_ellipsoid.radius_z_m: 0.0385
    grasp_ellipsoid.center_z_m: 0.1358
